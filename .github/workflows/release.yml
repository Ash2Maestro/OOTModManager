name: Create release
run-name: Release from ${{ github.ref_name }} (publish=${{ inputs.publish }})

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish immediately after validation (otherwise create a draft)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ootmodmanager-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: offscreen
      QSG_RHI_BACKEND: d3d11
      QSG_RHI_PREFER_SOFTWARE_RENDERER: '1'
      OOT_RELEASE_HEADLESS: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
          architecture: x64
          cache: pip
          cache-dependency-path: src/core/requirements.txt

      - name: Validate the version and reject existing tags or releases
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = & python -B -c "import sys; sys.path.insert(0, 'scripts'); from release import read_version, ROOT; print(read_version(ROOT))"
          if ($LASTEXITCODE) { throw 'Invalid VERSION.txt.' }
          $tag = "v$version"
          $refsJson = & gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/$tag"
          if ($LASTEXITCODE) { throw 'Unable to check existing tags.' }
          $refs = $refsJson | ConvertFrom-Json
          if (@($refs | Where-Object { $_.ref -eq "refs/tags/$tag" }).Count) {
              throw "$tag already exists. Increase VERSION.txt; existing releases are never overwritten."
          }
          $releaseTags = & gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases" --jq '.[].tag_name'
          if ($LASTEXITCODE) { throw 'Unable to check existing releases.' }
          if ($tag -in $releaseTags) { throw "A release or draft for $tag already exists." }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore the Qt SDK cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tools/qt/6.8.3/msvc2022_64
          key: windows-2022-qt-${{ hashFiles('scripts/Build.ps1') }}

      - name: Install build dependencies
        run: ./scripts/Build.ps1 -Setup -SetupOnly

      - name: Build, test and qualify the portable ZIP
        id: package
        run: |
          $resultFile = Join-Path $env:RUNNER_TEMP 'oot-release-result.json'
          ./scripts/Release.ps1 -NoOpen -ResultFile $resultFile
          if ($LASTEXITCODE) { throw 'Release qualification failed.' }
          $result = Get-Content -LiteralPath $resultFile -Raw | ConvertFrom-Json
          if ($result.version -ne '${{ steps.version.outputs.version }}') { throw 'Version changed during build.' }
          "directory=$($result.directory)" >> $env:GITHUB_OUTPUT

      - name: Retain validated release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          path: ${{ steps.package.outputs.directory }}/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Retain diagnostic logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-logs
          path: build/release-logs/
          if-no-files-found: ignore
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download the validated artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
          path: release-files

      - name: Verify checksums and create a draft
        working-directory: release-files
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --strict --check SHA256SUMS.txt
          gh release create "v$VERSION" \
            --repo "$GH_REPO" --target "$GITHUB_SHA" \
            --title "OOTModManager $VERSION" --draft \
            --notes-file RELEASE-NOTES.txt \
            "OOTModManager-$VERSION-windows-x64.zip" \
            "OOTModManager-$VERSION-sources.zip" SHA256SUMS.txt

      - name: Publish after all uploads succeed
        if: inputs.publish
        shell: bash
        run: gh release edit "v$VERSION" --repo "$GH_REPO" --draft=false

      - name: Write the release summary
        shell: bash
        run: |
          echo "Release **v$VERSION** created from commit \`$GITHUB_SHA\`." >> "$GITHUB_STEP_SUMMARY"
          echo "[Open Releases](https://github.com/$GH_REPO/releases) to review the draft or download the published build." >> "$GITHUB_STEP_SUMMARY"
